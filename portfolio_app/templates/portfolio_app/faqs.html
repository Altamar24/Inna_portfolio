{% extends 'portfolio_app/base.html' %}

{% block content %}
{% load static %}

    <!-- Main -->
    <div id="ckarla-main">
    <!-- Banner -->
    <div class="ready banner-padding bg-img" data-overlay-light="0" data-background="{% static 'images/1920x1080-no.jpg' %}">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="cat text-center animate-box fadeInUp animated" data-animate-effect="fadeInUp"> <span>ЧЗВ</span>
                        <hr class="line line-hr-center">
                        <h1>Часто задаваемые вопросы</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- FAQs -->
    <div class="section-padding">
        <div class="container">
            <div class="row">
                <div class="col-md-5">
                    <div class="karla-about-img mb-30">
                        <img src="{% static 'images/Inna_2.jpg' %}" alt=""> 
                    </div>
                </div>
                
                <div class="col-md-7 faqs-accordion">
                    <div class="accordion">
                                {% for question in questions %}
                                <div class="item">
                                    <div class="title">
                                        <h6>{{ question.question_faq }}</h6> </div>
                                    <div class="accordion-info" style="display: none;">
                                        <p>{{ question.answer_faq }}</p>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                </div>
            </div>
        </div>
    </div>

    {% endblock %}
